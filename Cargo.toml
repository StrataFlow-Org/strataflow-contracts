[package]
name = "strataflow-contracts"
version = "0.1.0"
edition = "2021"
authors = ["winningtalker-commits"]
license = "MIT"
description = "Soroban smart contracts for StrataFlow programmable milestone escrows on Stellar"
repository = "https://github.com/StrataFlow-Org/strataflow-contracts"
readme = "README.md"
keywords = ["stellar", "soroban", "escrow", "smart-contracts", "defi"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = "21.7.0"

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
